name: Build Kapin APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo holds only the Dart code; generate the Android shell and wire it up.
      - name: Generate and patch Android project
        run: |
          flutter create --org com.kapin --project-name location_sharing --platforms=android .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: >
          flutter build apk --debug
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}

      - uses: actions/upload-artifact@v4
        with:
          name: kapin-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
