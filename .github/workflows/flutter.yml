name: Build Kapin APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check secrets
        run: |
          if [ -z "$FIREBASE_API_KEY" ]; then
            echo "::warning::FIREBASE_* secrets are empty. The APK will run in TEST MODE (demo data, no real Firebase)."
          fi
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::warning::MAPS_API_KEY is empty. The app will show the preview map instead of Google Maps."
          fi

      # The repo holds only the Dart code; generate the Android shell and wire it up.
      - name: Generate and patch Android project
        run: |
          flutter create --org com.kapin --project-name location_sharing --platforms=android .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      # Release + per-ABI split: ~15-25 MB per APK instead of a ~150 MB debug build.
      - name: Build release APKs
        env:
          # Fixed TEST keystore so every build has the same signature and can
          # update the previous install. Replace with a private keystore for Play.
          KAPIN_KEYSTORE_PATH: ${{ github.workspace }}/android_setup/kapin-test.jks
          KAPIN_KEYSTORE_PASSWORD: kapin-test
          KAPIN_KEY_ALIAS: kapin
          KAPIN_KEY_PASSWORD: kapin-test
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}

      - uses: actions/upload-artifact@v4
        with:
          name: kapin-apks
          path: build/app/outputs/flutter-apk/*-release.apk
